services:
  - type: web
    name: vyapar-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: "Vyapar SchemeHub"
      - key: DEBUG
        value: "False"
      - key: API_V1_STR
        value: "/api/v1"
      - key: DATABASE_URL
        value: "sqlite:///msme.db"
      - key: QDRANT_PORT
        value: "443"
      - key: QDRANT_COLLECTION_NAME
        value: "msme_schemes"
      - key: EMBEDDING_MODEL_NAME
        value: "BAAI/bge-m3"
      - key: SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: QDRANT_HOST
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
